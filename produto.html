<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produto | Marta Coelho</title>
  <meta name="description" content="Peça Marta Coelho, feita à mão em Portugal.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.shopify.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=1793050000">
</head>
<body data-page="produto">
  <div id="site-header"></div>

  <main>
    <div class="pdp">
      <div>
        <div class="pdp__gallery" id="gallery"></div>
      </div>

      <div class="pdp__info">
        <nav class="crumbs" id="pdpCrumbs" aria-label="Navegação estrutural"></nav>
        <div class="pdp__line" id="pdpLine"></div>
        <h1 class="display pdp__name" id="pdpName"></h1>
        <div class="pdp__color" id="pdpColor"></div>
        <div class="pdp__price" id="pdpPrice"></div>
        <div class="pdp__tax">IVA incluído · Portes grátis em Portugal a partir de 150 €</div>
        <p class="pdp__intro" id="pdpIntro"></p>

        <div id="colorways"></div>
        <div id="sizes"></div>
        <div class="stock" id="stock"></div>

        <div class="notify" id="notify">
          <span id="avise-me"></span>
          <h3>Edição esgotada</h3>
          <p>Deixe o seu e-mail e avisamos assim que esta peça<span id="notifySize"></span> voltar a estar disponível.</p>
          <form novalidate>
            <label class="sr-only" for="notifyEmail">E-mail</label>
            <input id="notifyEmail" type="email" required placeholder="O seu e-mail">
            <button class="btn" type="submit">Avise-me</button>
          </form>
        </div>

        <div class="pdp__buy">
          <button class="btn btn--lg" id="addBtn">Adicionar ao carrinho</button>
          <button class="wish" id="wish" aria-label="Guardar nos favoritos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7.5-4.6-9.2-9.3C1.6 7.3 3.8 4 7.2 4c2 0 3.6 1.1 4.8 2.8C13.2 5.1 14.8 4 16.8 4c3.4 0 5.6 3.3 4.4 6.7C19.5 15.4 12 20 12 20Z"/></svg><span>Guardar nos favoritos</span></button>
        </div>

        <div class="pdp__assure">
          <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V10m0-5.5V4a1.5 1.5 0 0 1 3 0v6m0-5a1.5 1.5 0 0 1 3 0v5.5m0-3a1.5 1.5 0 0 1 3 0V14c0 4-3 7-7 7h-1c-3 0-4.5-1.6-6-4l-2.2-3.8a1.5 1.5 0 0 1 2.5-1.6L7 13"/></svg>Feito à mão em Portugal</div>
        </div>

        <div class="acc" id="acc"></div>
      </div>
    </div>

    <section class="section">
      <div class="section-head wrap"><h2 class="home-h">Complete o look</h2></div>
      <div class="plp" id="relGrid"></div>
    </section>
  </main>

  <div class="sticky-buy" id="stickyBuy"></div>
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Imagem ampliada">
    <button class="icon-btn lightbox__close" aria-label="Fechar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m5 5 14 14M19 5 5 19"/></svg></button>
    <button class="icon-btn lightbox__nav prev" aria-label="Anterior"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l-7 7 7 7"/></svg></button>
    <img alt="">
    <button class="icon-btn lightbox__nav next" aria-label="Seguinte"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>

  <div id="site-footer"></div>
  <script src="assets/js/data.js?v=1793050000"></script>
  <script src="assets/js/i18n.js?v=1793050000"></script>
  <script src="assets/js/main.js?v=1793050000"></script>
</body>
</html>
